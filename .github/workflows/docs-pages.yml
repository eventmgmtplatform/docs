name: Publish documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout certified product documentation source
        uses: actions/checkout@v6
        with:
          repository: eventmgmtplatform/event-management-platform
          ref: abd899c2c852828f3e0cbbdcfc63a6f1793f21cc
          path: product-source
          sparse-checkout: docs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: ./scripts/docs install

      - name: Validate documentation
        run: ./scripts/docs validate

      - name: Validate certified product synchronization
        run: ./scripts/docs sync-platform --check --source product-source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Build Nextra portal
        working-directory: portal
        env:
          OEM_DOCS_BASE_PATH: /docs
        run: npm run build

      - name: Audit portal links
        working-directory: portal
        env:
          OEM_DOCS_BASE_PATH: /docs
        run: npm run audit:links

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: portal/out

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
