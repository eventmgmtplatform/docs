site_name: Open Event Management
site_description: Documentación técnica de Open Event Management
site_url: https://eventmgmtplatform.github.io/event-mgmt-docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  platform/README.md
theme:
  name: material
  language: es
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.code.copy
  - search.suggest
  - search.highlight
extra_css:
- assets/stylesheets/kyndryl.css
extra_javascript:
- https://unpkg.com/mermaid@11/dist/mermaid.min.js
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
nav:
- Inicio: index.md
- Recursos visuales: assets/diagrams/index.md
- Inicio rápido:
  - Introducción: getting-started/index.md
  - Desarrollo local: getting-started/local-development.md
  - Primer evento: getting-started/first-event.md
- Conceptos:
  - Modelo de dominio: concepts/domain-model.md
  - Flujo de eventos: concepts/event-flow.md
  - Glosario: concepts/glossary.md
- Arquitectura:
  - Visión general: architecture/index.md
  - Flujos ejecutados: architecture/solution-flows.md
  - Topología runtime: architecture/runtime-topology.md
  - Contenedores: architecture/containers.md
  - Componentes: architecture/components.md
  - Datos: architecture/data.md
  - Seguridad: architecture/security.md
  - Despliegue: architecture/deployment.md
  - GCP: architecture/gcp.md
  - Mapa V1.0.0: architecture/v1-map.md
  - Cinco imágenes OEM: architecture/container-images.md
- Referencia:
  - API: reference/api/index.md
  - Eventos: reference/events/index.md
  - Configuración: reference/configuration.md
  - Terraform: reference/terraform.md
- Operación:
  - Runbook local: operations/local-runbook.md
  - Observabilidad: operations/observability.md
  - Incidentes: operations/incidents.md
  - Recuperación: operations/disaster-recovery.md
- Desarrollo:
  - Contribución: development/contributing.md
  - Estándares: development/standards.md
  - Pruebas: development/testing.md
  - Releases: development/releases.md
- Decisiones:
  - Índice ADR: decisions/index.md
  - Plantilla ADR: decisions/adr-template.md
- Proyecto:
  - Estado: project/status.md
  - WebGUI administrativa: project/webgui.md
  - Roadmap: project/roadmap.md
  - Deuda técnica: project/technical-debt.md
  - Base de conocimiento: knowledge/index.md
  - Defect Prevention: project/defect-prevention.md
  - Cobertura documental: project/documentation-coverage.md
  - DP Matrix V1 → V2: project/defect-prevention-matrix-v1-v2.md
- Plataforma integrada:
  - Índice: platform/index.md
  - Arquitectura integrada: platform/architecture/README.md
  - Event Processor: platform/event-processor/implementation-status.md
  - Processor — Defect Prevention: platform/event-processor/defect-prevention.md
  - Event State Service: platform/event-state-service/README.md
  - ESS — Defect Prevention: platform/event-state-service/defect-prevention.md
  - Dashboards: platform/dashboards/architecture.md
  - Kafka: platform/kafka/README.md
  - Integraciones: platform/integrations/index.md
  - GLPI: platform/integrations/glpi.md
  - CACF / NEXT: platform/cacf/README.md
  - CACF — Defect Prevention: platform/cacf/defect-prevention.md
  - ServiceNow: platform/servicenow/CHANGELOG.md
  - GNM: platform/gnm/CHANGELOG.md
  - Administración: platform/service-administration.md
  - Gobierno Git: platform/git/README.md
  - Changelogs: platform/changelogs/README.md
  - ESS conceptual: platform/event-state-service/conceptual-architecture.md
