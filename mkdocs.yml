site_name: Open Event Management
site_description: Documentación técnica de Open Event Management
site_url: https://eventmgmtplatform.github.io/event-mgmt-docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: es
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.code.copy
  - search.suggest
  - search.highlight
extra_css:
- assets/stylesheets/kyndryl.css
extra_javascript:
- https://unpkg.com/mermaid@11/dist/mermaid.min.js
- assets/javascripts/navigation.js
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
nav:
- Inicio: index.md
- Recursos visuales: assets/diagrams/index.md
- Inicio rápido:
  - Introducción: getting-started/index.md
  - Desarrollo local: getting-started/local-development.md
  - Primer evento: getting-started/first-event.md
- Conceptos:
  - Modelo de dominio: concepts/domain-model.md
  - Flujo de eventos: concepts/event-flow.md
  - Glosario: concepts/glossary.md
